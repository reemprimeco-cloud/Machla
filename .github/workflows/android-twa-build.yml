name: Build Android app (TWA)

# Builds the signed Android App Bundle that wraps machla.reemora.app as a
# Trusted Web Activity — the store listing for the app, not a rewrite of
# it; the TWA just shows the live site in Chrome full-screen.
#
# WHY THIS RUNS IN CI, NOT LOCALLY: Bubblewrap normally downloads the
# Android SDK/build tools from Google's servers, which a sandboxed dev
# environment may not have network access to. A GitHub-hosted runner
# does, and already ships a JDK and Android SDK — so this is the path
# that actually produces a buildable .aab without a local Android
# Studio setup.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions),
# see android-twa/README.md for how to create them:
#   ANDROID_KEYSTORE_BASE64  - `base64 -w0 your.keystore`
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-twa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing key
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > machla-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Install Bubblewrap
        run: npm install --no-save @bubblewrap/cli

      # Without this, `bubblewrap build` asks two interactive yes/no
      # questions ("install the JDK?" / "install the Android SDK?") the
      # first time it runs, which hangs forever on a non-interactive CI
      # runner — `bubblewrap updateConfig` doesn't avoid this, since it
      # also loads/creates the config (and so still prompts) before
      # applying its own arguments. Writing ~/.bubblewrap/config.json
      # directly, in the trivial shape @bubblewrap/core's Config class
      # reads, points it at the JDK actions/setup-java just installed
      # and the Android SDK GitHub's ubuntu-latest image already ships
      # at $ANDROID_HOME, so neither prompt is ever reached.
      - name: Point Bubblewrap at the runner's existing JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" \
            > ~/.bubblewrap/config.json

      # `bubblewrap build` reads twa-manifest.json in this directory
      # and produces app-release-signed.aab + app-release-signed.apk.
      - name: Build signed app bundle
        run: |
          npx bubblewrap build \
            --skipPwaValidation \
            --password="$ANDROID_KEYSTORE_PASSWORD" \
            --keyPassword="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: machla-android-release
          path: |
            android-twa/app-release-signed.aab
            android-twa/app-release-signed.apk
          retention-days: 30
